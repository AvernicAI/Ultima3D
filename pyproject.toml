[project]
name = "ultima3d"
version = "0.4.0"
description = "Ultima3D: unified agentic 3D MCP server — procedural asset compiler, live Blender GUI tools, Godot editor bridge."
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mcp>=2.0", "httpx>=0.27.0"]

[project.scripts]
ultima3d = "ultima3d.server:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ultima3d*"]
