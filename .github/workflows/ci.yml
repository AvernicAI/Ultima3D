name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build workspace
        run: cargo build --workspace --manifest-path rust/Cargo.toml
      - name: Unit + parity tests (no Blender/Godot needed)
        run: cargo test --workspace --manifest-path rust/Cargo.toml
