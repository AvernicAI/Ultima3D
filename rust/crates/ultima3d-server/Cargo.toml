[package]
name = "ultima3d-server"
version = "0.5.0"
edition = "2021"

[[bin]]
name = "ultima3d-server"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.8", features = ["server", "transport-io", "schemars"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
schemars = "1"
