[package]
name = "ultima3d-server"
version = "0.6.0"
edition = "2021"

[[bin]]
name = "ultima3d-server"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.8", features = ["server", "transport-io", "schemars"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
schemars = "1"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json"] }
png = "0.17"
tree-sitter = "0.25"
tree-sitter-python = "0.25"
