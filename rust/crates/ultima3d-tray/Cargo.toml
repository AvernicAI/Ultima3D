[package]
name = "ultima3d-tray"
version = "0.6.0"
edition = "2021"

[[bin]]
name = "ultima3d-tray"
path = "src/main.rs"

[dependencies]
tray-icon = "0.26"
muda = "0.21"
png = "0.17"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
] }
